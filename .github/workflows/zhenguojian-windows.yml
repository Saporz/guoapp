name: Build Zhenguojian Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Enable MinGW compiler
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Sync missing lockfile dependencies
        shell: pwsh
        run: flutter pub get
      - name: Test playback diagnostics
        shell: pwsh
        run: flutter test test/playback_diagnostics_test.dart --dart-define=ALL_SOURCES=true
      - name: Build all-sources Windows package
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: python scripts/build_windows.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
